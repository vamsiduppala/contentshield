services:
  api:
    build: ./backend
    command: npm run start:dev
    env_file: ./backend/.env.example
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - redis
  worker:
    build: ./backend
    command: npm run start:worker
    env_file: ./backend/.env.example
    depends_on:
      - api
      - postgres
      - redis
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: contentshield
      POSTGRES_PASSWORD: contentshield
      POSTGRES_DB: contentshield
    ports:
      - "5432:5432"
  redis:
    image: redis:7
    ports:
      - "6379:6379"
