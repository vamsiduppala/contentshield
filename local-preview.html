<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ContentShield AI Local Preview</title>
  <style>
    :root{--void:#050712;--night:#090d1f;--line:rgba(255,255,255,.12);--acid:#7cff9b;--cyan:#55d6ff;--violet:#9a7cff;--amber:#ffd38a}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,Segoe UI,system-ui,sans-serif;background:radial-gradient(circle at 20% 0,rgba(124,255,155,.16),transparent 28rem),radial-gradient(circle at 80% 20%,rgba(154,124,255,.2),transparent 30rem),var(--void);color:white}
    a{color:inherit;text-decoration:none}.shell{display:grid;grid-template-columns:17rem 1fr;min-height:100vh}.side{border-right:1px solid var(--line);background:rgba(255,255,255,.04);padding:1rem}.brand{font-weight:800;margin:1rem 0 2rem}.nav button{display:block;width:100%;text-align:left;padding:.85rem 1rem;border:0;border-radius:1rem;color:rgba(255,255,255,.58);margin:.2rem 0;background:transparent;cursor:pointer}.nav button:hover,.nav button.active{background:rgba(124,255,155,.12);color:var(--acid)}main{padding:2rem}.eyebrow{color:var(--cyan);text-transform:uppercase;letter-spacing:.22em;font-size:.8rem;font-weight:800}.h1{font-size:clamp(2.7rem,6vw,6rem);line-height:.95;margin:.5rem 0}.muted{color:rgba(255,255,255,.58);line-height:1.7}.grid{display:grid;gap:1rem}.cols4{grid-template-columns:repeat(4,minmax(0,1fr))}.cols3{grid-template-columns:2fr 1.2fr 1fr}.card{border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:1.5rem;padding:1.25rem;box-shadow:0 28px 90px rgba(0,0,0,.3);backdrop-filter:blur(20px)}.btn{display:inline-flex;border:0;border-radius:999px;padding:.8rem 1.1rem;background:var(--acid);color:var(--void);font-weight:800;cursor:pointer}.secondary{background:rgba(255,255,255,.08);color:white;border:1px solid var(--line)}.metric strong{display:block;font-size:2.5rem;margin:.5rem 0}.score{font-size:5rem;color:var(--acid);font-weight:900}.badge{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:.35rem .65rem;color:var(--cyan);font-size:.8rem}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:.8rem;border-top:1px solid var(--line);text-align:left}.timeline{height:3rem;background:rgba(255,255,255,.09);border-radius:999px;position:relative}.marker{position:absolute;top:50%;width:1rem;height:1rem;border-radius:50%;transform:translateY(-50%);background:var(--amber);box-shadow:0 0 25px rgba(255,211,138,.6)}.video{aspect-ratio:16/9;border-radius:1.4rem;background:linear-gradient(135deg,rgba(85,214,255,.22),rgba(154,124,255,.25));display:grid;place-items:center;font-size:3rem}@media(max-width:900px){.shell{grid-template-columns:1fr}.cols4,.cols3{grid-template-columns:1fr}}
  </style>
</head>
<body><div id="app"></div><script>
const scans=[{id:"scan_1027",title:"Border Conflict Explainer - Final Cut",score:67,verdict:"high_risk",riskCount:14},{id:"scan_1019",title:"Podcast Episode 41 - Creator Burnout",score:91,verdict:"safe",riskCount:3},{id:"scan_1008",title:"Gaming News Weekly",score:78,verdict:"limited_risk",riskCount:8}];
const findings=[{timestamp:"00:01:14",phrase:"war",source:"speech",severity:"high",suggestion:"conflict"},{timestamp:"00:03:22",phrase:"dead bodies",source:"onscreen_text",severity:"critical",suggestion:"casualties"},{timestamp:"00:05:40",phrase:"assault",source:"caption",severity:"high",suggestion:"attack incident"}];
const app=document.getElementById("app");let page="landing";
function nav(){return '<aside class="side"><div class="brand">ContentShield AI</div><nav class="nav">'+["landing","dashboard","new scan","processing","results","history","editor","summary","api contracts"].map(p=>'<button onclick="page=\\''+p+'\\';render()">'+p+'</button>').join("")+'</nav></aside>'}
function layout(c){app.innerHTML='<div class="shell">'+nav()+'<main>'+c+'</main></div>'}
function render(){if(page==="landing")app.innerHTML='<main><p class="eyebrow">Local preview</p><h1 class="h1">Protect Creator Revenue Before YouTube Flags Your Video.</h1><p class="muted">This self-contained preview lets you test the frontend flow and mock backend contracts without installing packages.</p><button class="btn" onclick="page=\\'dashboard\\';render()">Open Dashboard</button></main>'; if(page==="dashboard")layout('<p class="eyebrow">AI command center</p><h1 class="h1">Welcome to ContentShield AI.</h1><div class="grid cols4">'+[['Total Scans',3],['Average Safety Score',79],['High-Risk Videos',1],['Fix Suggestions',25]].map(m=>'<div class="card metric"><span>'+m[0]+'</span><strong>'+m[1]+'</strong></div>').join('')+'</div>'); if(page==="new scan")layout('<p class="eyebrow">New Scan Job</p><h1 class="h1">Start an AI monetization safety scan.</h1><div class="card"><input type="file"><p><button class="btn" onclick="page=\\'processing\\';render()">Start AI Scan</button></p></div>'); if(page==="processing")layout('<p class="eyebrow">AI processing</p><h1 class="h1">ContentShield AI is scanning your draft.</h1><div class="card"><div class="score">76%</div><p class="muted">Transcribing speech · Reading on-screen text · Detecting sensitive language</p><button class="btn" onclick="page=\\'results\\';render()">View Results</button></div>'); if(page==="results")layout('<p class="eyebrow">Results</p><h1 class="h1">Border Conflict Explainer</h1><div class="card"><div class="score">67</div><p>High Risk</p><button class="btn" onclick="page=\\'editor\\';render()">Continue to Editor Review</button></div><table class="table"><tr><th>Time</th><th>Phrase</th><th>Source</th><th>Severity</th><th>Suggestion</th></tr>'+findings.map(f=>'<tr><td>'+f.timestamp+'</td><td>'+f.phrase+'</td><td>'+f.source+'</td><td>'+f.severity+'</td><td>'+f.suggestion+'</td></tr>').join('')+'</table>'); if(page==="history")layout('<p class="eyebrow">History</p><h1 class="h1">Every scan in one place.</h1>'+scans.map(s=>'<div class="card"><b>'+s.title+'</b><p class="muted">'+s.verdict+' · score '+s.score+'</p></div>').join('')); if(page==="editor")layout('<p class="eyebrow">Editor Session</p><h1 class="h1">Review and fix monetization risks.</h1><div class="grid cols3"><div class="card"><div class="video">▶</div><div class="timeline"><span class="marker" style="left:25%"></span><span class="marker" style="left:55%"></span></div></div><div class="card">'+findings.map(f=>'<p><span class="badge">'+f.timestamp+'</span> Transcript contains <mark>'+f.phrase+'</mark></p>').join('')+'</div><div class="card"><button class="btn secondary">Beep</button> <button class="btn secondary">Mute</button> <button class="btn secondary">Blur</button> <button class="btn secondary">Replace</button><p><button class="btn" onclick="page=\\'summary\\';render()">Finish Review</button></p></div></div>'); if(page==="summary")layout('<p class="eyebrow">Review Complete</p><h1 class="h1">Your video is safer for upload.</h1><div class="grid cols4"><div class="card metric"><span>Original</span><strong>67</strong></div><div class="card metric"><span>Updated</span><strong>88</strong></div><div class="card metric"><span>Resolved</span><strong>14</strong></div><div class="card metric"><span>Remaining</span><strong>0</strong></div></div>'); if(page==="api contracts")layout('<p class="eyebrow">Mock API contracts</p><h1 class="h1">Backend endpoints included.</h1><pre class="card">GET /api/v1/health\\nPOST /api/v1/videos/upload-url\\nPOST /api/v1/scans\\nGET /api/v1/scans/:id/status\\nGET /api/v1/scans/:id/results\\nGET /api/v1/editor/:scanId/session\\nPOST /api/v1/editor/:scanId/findings/:findingId/actions\\nPOST /api/v1/editor/:scanId/exports</pre>')}
render();
</script></body></html>
