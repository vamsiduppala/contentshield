<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ContentShield AI Preview</title>
  <style>
    :root{--bg:#050712;--panel:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);--acid:#7cff9b;--cyan:#55d6ff;--amber:#ffd38a;--violet:#9a7cff}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,rgba(124,255,155,.16),transparent 26rem),radial-gradient(circle at 80% 20%,rgba(154,124,255,.2),transparent 28rem),var(--bg);color:#fff;font-family:Segoe UI,Inter,system-ui,sans-serif}
    header{position:sticky;top:0;background:rgba(5,7,18,.78);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);padding:1rem 1.25rem;z-index:2}
    nav{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}button{border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;border-radius:999px;padding:.7rem 1rem;font-weight:700;cursor:pointer}button.primary{background:var(--acid);color:#050712;border-color:transparent}.brand{font-weight:900;margin-right:1rem}
    main{padding:clamp(1rem,4vw,3rem);max-width:1300px;margin:auto}.eyebrow{color:var(--cyan);font-size:.8rem;font-weight:900;text-transform:uppercase;letter-spacing:.22em}.h1{font-size:clamp(2.4rem,6vw,5.8rem);line-height:.95;margin:.5rem 0 1rem}.muted{color:rgba(255,255,255,.62);line-height:1.7}.grid{display:grid;gap:1rem}.cols{grid-template-columns:repeat(4,minmax(0,1fr))}.workspace{grid-template-columns:40fr 35fr 25fr}.card{border:1px solid var(--line);background:var(--panel);border-radius:1.4rem;padding:1.2rem;box-shadow:0 24px 70px rgba(0,0,0,.28)}.metric strong{display:block;font-size:2.8rem;margin:.4rem 0}.score{font-size:5rem;color:var(--acid);font-weight:900}.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:.35rem .6rem;color:var(--cyan);font-size:.78rem}.table{width:100%;border-collapse:collapse}.table th,.table td{border-top:1px solid var(--line);padding:.75rem;text-align:left}.video{aspect-ratio:16/9;border-radius:1.2rem;background:linear-gradient(135deg,rgba(85,214,255,.22),rgba(154,124,255,.25));display:grid;place-items:center;font-size:3rem}.timeline{height:2.5rem;background:rgba(255,255,255,.1);border-radius:999px;position:relative}.marker{position:absolute;top:50%;width:1rem;height:1rem;border-radius:50%;transform:translateY(-50%);background:var(--amber);box-shadow:0 0 22px rgba(255,211,138,.7)}mark{background:rgba(255,211,138,.2);color:var(--amber);border:1px solid rgba(255,211,138,.35);border-radius:.4rem;padding:.05rem .25rem}@media(max-width:900px){.cols,.workspace{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header><nav><span class="brand">ContentShield AI</span><button onclick="show('landing')" class="primary">Landing</button><button onclick="show('dashboard')">Dashboard</button><button onclick="show('scan')">Scan</button><button onclick="show('results')">Results</button><button onclick="show('editor')">Editor</button><button onclick="show('summary')">Summary</button></nav></header>
  <main id="app"></main>
  <script>
    const findings=[["00:01:14","war","Speech","High","conflict"],["00:03:22","dead bodies","On-screen text","Critical","casualties"],["00:05:40","assault","Caption","High","attack incident"]];
    const app=document.getElementById("app");
    function table(){return '<table class="table"><tr><th>Timestamp</th><th>Phrase</th><th>Source</th><th>Severity</th><th>Suggestion</th></tr>'+findings.map(f=>'<tr>'+f.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</table>'}
    function show(page){
      if(page==="landing") app.innerHTML='<p class="eyebrow">Investor demo preview</p><h1 class="h1">Protect Creator Revenue Before YouTube Flags Your Video.</h1><p class="muted">ContentShield AI combines scan results, editor review, edit-decision instructions, and export-ready reports in one premium mock preview.</p><button class="primary" onclick="show(\\'dashboard\\')">Open Dashboard</button>';
      if(page==="dashboard") app.innerHTML='<p class="eyebrow">AI command center</p><h1 class="h1">Welcome to ContentShield AI.</h1><div class="grid cols">'+["Total Scans|3","Average Score|79","High-Risk Videos|1","Fix Suggestions|25"].map(x=>{const [a,b]=x.split("|");return '<div class="card metric"><span>'+a+'</span><strong>'+b+'</strong><p class="muted">Mock live data</p></div>'}).join("")+'</div>';
      if(page==="scan") app.innerHTML='<p class="eyebrow">New Scan Job</p><h1 class="h1">Start an AI monetization safety scan.</h1><div class="card"><h2>Upload Video</h2><p class="muted">Drag/drop UI, scan settings, AI stages, processing logs, and mock API contracts are represented in the full source.</p><button class="primary" onclick="show(\\'results\\')">Start AI Scan</button></div>';
      if(page==="results") app.innerHTML='<p class="eyebrow">Results summary</p><h1 class="h1">Border Conflict Explainer</h1><div class="grid cols"><div class="card"><div class="score">67</div><p>Monetization Safety Score</p></div><div class="card"><h2>High Risk</h2><p class="muted">Advertiser-sensitive terms related to conflict, death, and political violence.</p></div></div><h2>Risk Findings</h2>'+table()+'<p><button class="primary" onclick="show(\\'editor\\')">Continue to Editor Review</button></p>';
      if(page==="editor") app.innerHTML='<p class="eyebrow">Editor Session</p><h1 class="h1">Review and fix monetization risks.</h1><div class="grid workspace"><div class="card"><div class="video">▶</div><h3>Risk timeline</h3><div class="timeline"><span class="marker" style="left:22%"></span><span class="marker" style="left:55%"></span><span class="marker" style="left:74%"></span></div></div><div class="card"><h2>Transcript Review</h2><p><span class="badge">00:01:14</span> The <mark>war</mark> situation became worse after several attacks.</p><p><span class="badge">00:03:22</span> The screen shows <mark>dead bodies</mark> near the border.</p></div><div class="card"><h2>Finding Inspector</h2><p class="muted">Edit decision instructions only. No video rendering.</p><button>Beep</button> <button>Mute</button> <button>Blur</button> <button>Replace</button><p><button class="primary" onclick="show(\\'summary\\')">Finish Review</button></p></div></div>';
      if(page==="summary") app.innerHTML='<p class="eyebrow">Review Complete</p><h1 class="h1">Your video is safer for upload.</h1><div class="grid cols">'+["Original Score|67","Updated Score|88","Resolved|14","Remaining|0"].map(x=>{const [a,b]=x.split("|");return '<div class="card metric"><span>'+a+'</span><strong>'+b+'</strong></div>'}).join("")+'</div><div class="card"><h2>Exports</h2><button>PDF</button> <button>CSV</button> <button>Premiere Markers</button> <button>CapCut Notes</button></div>';
    }
    show("landing");
  </script>
</body>
</html>
